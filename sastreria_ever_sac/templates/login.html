{% extends "base.html" %}
{% block title %}Iniciar Sesión — Sastrería Ever S.A.C.{% endblock %}

{% block content %}
<div class="login-screen">
    <div class="login-card">
        <div class="login-header">
            <span class="brand-badge">SASTRERÍA EVER S.A.C.</span>
            <h1>Bienvenido al Sistema</h1>
            <p>Conéctate a <strong>SastreriaEverDB</strong> para gestionar pedidos, medidas, telas y auditoría.</p>
        </div>

        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}">
            <div class="field">
                <label for="auth_mode">Modo de conexión a SQL Server</label>
                <select id="auth_mode" name="auth_mode" onchange="toggleSqlFields()">
                    <option value="windows" {% if auth_mode == 'windows' %}selected{% endif %}>Autenticación de Windows (Recomendado)</option>
                    <option value="sql" {% if auth_mode == 'sql' %}selected{% endif %}>SQL Server Login (Usuario y Clave)</option>
                </select>
            </div>

            <div id="sql-fields" style="display: {% if auth_mode == 'sql' %}block{% else %}none{% endif %};">
                <div class="field">
                    <label for="username">Usuario SQL</label>
                    <input type="text" id="username" name="username" value="{{ username or '' }}" placeholder="Ej. sa">
                </div>
                <div class="field">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña">
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-full">Iniciar Sesión</button>
        </form>
    </div>
</div>

<script>
function toggleSqlFields() {
    const mode = document.getElementById("auth_mode").value;
    document.getElementById("sql-fields").style.display = mode === "sql" ? "block" : "none";
}
</script>
{% endblock %}
